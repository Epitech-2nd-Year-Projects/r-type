name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    env:
      LLVM_VERSION: "19.1.7"
      CC: clang
      CXX: clang++
      AR: llvm-ar
      NM: llvm-nm
      RANLIB: llvm-ranlib

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libx11-dev \
            libxext-dev \
            libxi-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxxf86vm-dev \
            libasound2-dev \
            libpulse-dev \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libswresample-dev \
            libswscale-dev

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
          build-cache: true

      - name: Install LLVM/Clang ${{ env.LLVM_VERSION }}
        shell: bash
        run: |
          set -euo pipefail
          LLVM_MAJOR="${LLVM_VERSION%%.*}"
          curl -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh "$LLVM_MAJOR" all
          LLVM_BIN_DIR="/usr/lib/llvm-${LLVM_MAJOR}/bin"
          echo "$LLVM_BIN_DIR" >> "$GITHUB_PATH"
          echo "LLVM_BINDIR=$LLVM_BIN_DIR" >> "$GITHUB_ENV"

      - name: Build Release
        run: |
          xmake f -m release --yes
          xmake build --yes

      - name: Package Linux
        run: |
          mkdir -p release/r-type-linux
          cp build/linux/x86_64/release/client release/r-type-linux/r-type-client
          cp build/linux/x86_64/release/server release/r-type-linux/r-type-server
          cp -r assets release/r-type-linux/
          cp -r config release/r-type-linux/
          
          cd release
          tar -czvf r-type-linux.tar.gz r-type-linux

      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: r-type-linux
          path: release/r-type-linux.tar.gz

  build-windows:
    runs-on: windows-latest
    env:
      LLVM_VERSION: "19.1.7"
      CC: clang-cl
      CXX: clang-cl

    steps:
      - uses: actions/checkout@v4

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
          build-cache: true

      - name: Install LLVM/Clang ${{ env.LLVM_VERSION }}
        shell: pwsh
        run: |
          $version = "${{ env.LLVM_VERSION }}"
          choco install llvm --version $version --allow-downgrade --no-progress -y
          $binDir = "C:\Program Files\LLVM\bin"
          if (-not (Test-Path $binDir)) {
            throw "Expected LLVM bin directory '$binDir' was not found."
          }
          $binDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "LLVM_BINDIR=$binDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install FFmpeg (dev)
        shell: pwsh
        run: |
          $ffmpegUrl = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n7.1-latest-win64-lgpl-shared-7.1.zip"
          $zipPath = Join-Path $env:RUNNER_TEMP "ffmpeg.zip"
          $extractPath = Join-Path $env:RUNNER_TEMP "ffmpeg"
          Invoke-WebRequest -Uri $ffmpegUrl -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath $extractPath
          $ffmpegRoot = Get-ChildItem -Path $extractPath -Directory | Select-Object -First 1
          if (-not $ffmpegRoot) {
            throw "FFmpeg archive did not contain a root directory."
          }
          $ffmpegDir = $ffmpegRoot.FullName
          "$ffmpegDir\\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "FFMPEG_DIR=$ffmpegDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Release
        shell: bash
        run: |
          xmake f -p windows -a x64 -m release --toolchain=clang-cl --yes
          xmake build --yes

      - name: Package Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release/r-type-windows
          Copy-Item build/windows/x64/release/client.exe -Destination release/r-type-windows/r-type-client.exe
          Copy-Item build/windows/x64/release/server.exe -Destination release/r-type-windows/r-type-server.exe
          Copy-Item -Recurse -Path assets -Destination release/r-type-windows/assets
          Copy-Item -Recurse -Path config -Destination release/r-type-windows/config
          if (-not $env:FFMPEG_DIR) {
            throw "FFMPEG_DIR is not set; cannot bundle FFmpeg DLLs."
          }
          Copy-Item -Path (Join-Path $env:FFMPEG_DIR "bin\*.dll") -Destination release/r-type-windows -Force
          
          Compress-Archive -Path release/r-type-windows -DestinationPath release/r-type-windows.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: r-type-windows
          path: release/r-type-windows.zip

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Linux Artifacts
        uses: actions/download-artifact@v7
        with:
          name: r-type-linux
          path: .
      
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v7
        with:
          name: r-type-windows
          path: .

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            r-type-linux.tar.gz
            r-type-windows.zip
          draft: false
          prerelease: false
