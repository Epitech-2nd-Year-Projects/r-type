name: Windows CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest
    env:
      LLVM_VERSION: "19.1.7"
      CC: clang
      CXX: clang++
      AR: llvm-ar
      NM: llvm-nm
      RANLIB: llvm-ranlib

    steps:
      - uses: actions/checkout@v4

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
          build-cache: true

      - name: Install LLVM/Clang ${{ env.LLVM_VERSION }}
        shell: pwsh
        run: |
          $version = "${{ env.LLVM_VERSION }}"
          choco install llvm --version $version --allow-downgrade --no-progress -y
          $binDir = "C:\Program Files\LLVM\bin"
          if (-not (Test-Path $binDir)) {
            throw "Expected LLVM bin directory '$binDir' was not found."
          }
          $binDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "LLVM_BINDIR=$binDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install FFmpeg (dev)
        shell: pwsh
        run: |
          $ffmpegUrl = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n7.1-latest-win64-lgpl-shared-7.1.zip"
          $zipPath = Join-Path $env:RUNNER_TEMP "ffmpeg.zip"
          $extractPath = Join-Path $env:RUNNER_TEMP "ffmpeg"
          Invoke-WebRequest -Uri $ffmpegUrl -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath $extractPath
          $ffmpegRoot = Get-ChildItem -Path $extractPath -Directory | Select-Object -First 1
          if (-not $ffmpegRoot) {
            throw "FFmpeg archive did not contain a root directory."
          }
          $ffmpegDir = $ffmpegRoot.FullName
          "$ffmpegDir\\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "FFMPEG_DIR=$ffmpegDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build
        id: build
        run: bash scripts/build.sh
        continue-on-error: true
        timeout-minutes: 20

      - name: Dump xmake install logs
        if: ${{ always() }}
        shell: pwsh
        run: |
          $root = Join-Path $env:LOCALAPPDATA ".xmake\cache\packages"
          if (-not (Test-Path $root)) {
            Write-Host "Missing xmake cache root $root"
            exit 0
          }
          $logs = Get-ChildItem -Path $root -Recurse -Filter install.txt |
            Where-Object { $_.FullName -match "\\\\installdir.failed\\\\logs\\\\install.txt$" }
          if (-not $logs) {
            Write-Host "No install.txt logs found under $root"
            exit 0
          }
          foreach ($log in $logs) {
            Write-Host "==== $($log.FullName)"
            Get-Content $log.FullName
          }

      - name: Test
        if: ${{ steps.build.outcome == 'success' }}
        run: bash scripts/test.sh

      - name: Check format
        if: ${{ steps.build.outcome == 'success' }}
        run: bash scripts/format-check.sh

      - name: Fail if build failed
        if: ${{ steps.build.outcome != 'success' }}
        run: exit 1
