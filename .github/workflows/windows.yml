name: Windows CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest
    env:
      CC: clang
      CXX: clang++

    steps:
      - uses: actions/checkout@v4

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
          build-cache: true

      - name: Cache choco packages
        uses: actions/cache@v4
        with:
          path: C:\ProgramData\chocolatey\lib
          key: ${{ runner.os }}-choco-${{ hashFiles('.github/workflows/windows.yml') }}
          restore-keys: |
            ${{ runner.os }}-choco-

      - name: Install latest LLVM toolchain
        run: |
          choco upgrade llvm -y --no-progress
          refreshenv

      - name: Build
        run: bash scripts/build.sh

      - name: Test
        run: bash scripts/test.sh

      - name: Check format
        run: bash scripts/format-check.sh
