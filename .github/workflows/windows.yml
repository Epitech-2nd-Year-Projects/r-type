name: Windows CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest
    env:
      LLVM_VERSION: "19.1.7"
      CC: clang
      CXX: clang++
      AR: llvm-ar
      NM: llvm-nm
      RANLIB: llvm-ranlib

    steps:
      - uses: actions/checkout@v4

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
          build-cache: true

      - name: Install LLVM ${{ env.LLVM_VERSION }}
        id: install-llvm
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Configure LLVM toolchain
        shell: pwsh
        run: |
          $binDir = "${{ steps.install-llvm.outputs.bin-path }}"
          if (-not $binDir) {
            $binDir = Join-Path "${{ steps.install-llvm.outputs.path }}" "bin"
          }
          $binDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "LLVM_BINDIR=$binDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build
        run: bash scripts/build.sh

      - name: Test
        run: bash scripts/test.sh

      - name: Check format
        run: bash scripts/format-check.sh
