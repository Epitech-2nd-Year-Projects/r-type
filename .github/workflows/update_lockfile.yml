name: "Update Lockfile"

on:
  push:
    branches:
      - feature/rtp-189-fix-windows-ci

jobs:
  update-lock:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
            ref: ${{ github.head_ref }}

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Configure and Update Lockfile
        run: |
          xmake f -p windows -a x64 -m release --toolchain=msvc --yes
        shell: cmd

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add xmake-requires.lock
          git commit -m "chore (ci): update xmake-requires.lock for windows [skip ci]"
          git push
        shell: cmd
