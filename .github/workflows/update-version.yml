name: Update version.json

on:
  release:
    types: [published]

permissions:
  contents: write
  pull-requests: write

jobs:
  update-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Update version config
        run: |
          version="${{ github.event.release.tag_name }}"
          if [[ -z "$version" ]]; then
            echo "Release tag is missing"
            exit 1
          fi
          cat > config/version.json <<EOF
          {
            "version": "$version"
          }
          EOF

      - name: Create pull request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "feat(version.json): update version.json for ${{ github.event.release.tag_name }}"
          title: "feat(version.json): update version.json for ${{ github.event.release.tag_name }}"
          body: "Automated update from release tag ${{ github.event.release.tag_name }}."
          branch: "automation/version-json-${{ github.event.release.tag_name }}"
          delete-branch: true
