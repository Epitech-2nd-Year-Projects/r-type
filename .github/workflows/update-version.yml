name: Update version.json

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  update-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Update version config
        run: |
          version="${{ github.event.release.tag_name }}"
          if [[ -z "$version" ]]; then
            echo "Release tag is missing"
            exit 1
          fi
          cat > config/version.json <<EOF
          {
            "version": "$version"
          }
          EOF

      - name: Commit version config
        run: |
          if git diff --quiet -- config/version.json; then
            echo "version.json already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/version.json
          git commit -m "feat(version.json): update version.json for ${{ github.event.release.tag_name }}"
          git push
