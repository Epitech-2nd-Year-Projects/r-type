name: mirror

on: push

env:
  MIRROR_URL: "git@github.com:EpitechPGE3-2025/G-CPP-500-PAR-5-2-rtype-1.git"

jobs:
  push_to_mirror:
    name: Push to mirror
    runs-on: ubuntu-latest

    if: github.repository != 'EpitechPGE3-2025/G-CPP-500-PAR-5-2-rtype-1' && github.ref == 'refs/heads/main'
    steps:
      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.GIT_SSH_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Install Git LFS
        run: git lfs install --local

      - name: Fetch LFS objects
        run: git lfs fetch --all

      - name: Mirroring to the repository
        uses: pixta-dev/repository-mirroring-action@v1
        with:
          ssh_private_key: ${{ secrets.GIT_SSH_PRIVATE_KEY }}
          target_repo_url: ${{ env.MIRROR_URL }}

      - name: Push LFS objects to mirror
        run: |
          git remote get-url mirror || git remote add mirror "${MIRROR_URL}"
          git lfs push mirror --all
